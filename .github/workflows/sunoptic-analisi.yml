# Il sito blocca gli accessi automatici (403): analisi disattivata, si parte solo a mano. In sola lettura del sito Sunoptic: nessun dato viene salvato nel repository (pubblico).
name: sunoptic-analisi
on:
  workflow_dispatch:
jobs:
  analisi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node fornitori/sunoptic/analisi.mjs
