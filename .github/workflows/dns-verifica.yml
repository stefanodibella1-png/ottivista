# Verifica in sola lettura dei DNS di socialglass.it (nessuna modifica)
name: dns-verifica
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/dns-verifica.yml"]
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Interroga registro .it, nameserver Register e Vercel
        run: |
          sudo apt-get -qq install -y dnsutils >/dev/null 2>&1 || true
          D=socialglass.it; R=""
          r(){ R="$R | $1"; }
          r "REGISTRO: $(dig +norec NS $D @a.dns.it | grep -E 'IN[[:space:]]+NS' | awk '{print $5}' | tr '\n' ' ')"
          for t in A AAAA MX TXT CAA SRV; do r "$t @: $(dig $t $D @ns1.register.it +short | tr '\n' ' ')"; done
          for h in www mail pop pop3 imap smtp webmail pec autodiscover autoconfig ftp mx _dmarc default._domainkey; do
            v=$(dig $h.$D @ns1.register.it +noall +answer | awk '{print $4"="$5}' | tr '\n' ' '); [ -n "$v" ] && r "$h: $v"; done
          echo "::notice title=Zona Register::$R"
          echo "::notice title=Pubblico::8.8.8.8 NS $(dig NS $D @8.8.8.8 +short | tr '\n' ' ') · MX $(dig MX $D @8.8.8.8 +short | tr '\n' ' ')"
