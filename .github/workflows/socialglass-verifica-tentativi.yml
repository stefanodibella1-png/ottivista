# Verifica una tantum (da togliere): il limite dei tentativi sbagliati vale su tutte le copie del server (conteggio nel database)
name: socialglass-verifica-tentativi
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - run: |
          R=""; for i in $(seq 1 10); do R="$R $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"ruolo":"ottico","codice":"ZZZ999","password":"x"}' https://socialglass.vercel.app/api/login)"; done
          echo "risposte:$R"
          case "$R" in *429*) echo "::notice title=Tentativi::limite attivo ($R)";; *) echo "::error title=Tentativi::limite NON attivo ($R)"; exit 1;; esac
