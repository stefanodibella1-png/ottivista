# Pubblica SocialGlass su Vercel e collega Stripe (modalità test).
# Segreti richiesti nel repo: VERCEL_TOKEN, STRIPE_SECRET_KEY (sk_test_...), FIREBASE_SERVICE_ACCOUNT (json). Facoltativo: AIRTABLE_TOKEN.
name: socialglass-deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["socialglass/**"]
concurrency: socialglass-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      PROJECT: socialglass
    steps:
      - uses: actions/checkout@v4
      - name: Pulizia segreti (spazi e a capo incollati per errore)
        run: |
          K=$(printf '%s' "$STRIPE_SECRET_KEY" | tr -d '[:space:]'); X=$(printf '%s' "$K" | grep -oE '(sk|rk)_test_[A-Za-z0-9]+' | head -1); [ -z "$X" ] || K="$X"; echo "::add-mask::$K"; echo "STRIPE_SECRET_KEY=$K" >> $GITHUB_ENV
          T=$(printf '%s' "$VERCEL_TOKEN" | tr -d '[:space:]'); echo "::add-mask::$T"; echo "VERCEL_TOKEN=$T" >> $GITHUB_ENV
          W=$(printf '%s' "$STRIPE_SECRET_KEY" | head -c 40 | grep -oE '^[A-Za-z ]{1,20}' || true)
          echo "::notice title=Diagnosi segreti::Stripe lunghezza ${#K}, contiene sk_: $(printf '%s' "$K" | grep -c 'sk_' || true), testo iniziale: '$W' · Vercel lunghezza ${#T} · Firebase presente: $([ -n "$FIREBASE_SERVICE_ACCOUNT" ] && echo si || echo no)"
          case "$K" in sk_test_*|rk_test_*) ;; *) echo "::warning title=Stripe::chiave non valida, pubblico con pagamento simulato"; echo "STRIPE_SECRET_KEY=" >> $GITHUB_ENV;; esac
      - name: Controllo segreti
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::Manca il segreto VERCEL_TOKEN"; exit 1; fi
          case "$STRIPE_SECRET_KEY" in sk_test_*|rk_test_*) ;; "") echo "::warning::STRIPE_SECRET_KEY assente: pagamento simulato";; sk_live_*|rk_live_*) echo "::error::Questa è una chiave LIVE: usa quella di TEST (sk_test_...)"; exit 1;; *) echo "::error::La chiave Stripe non inizia con sk_test_ (inizia con: $(printf '%s' "$STRIPE_SECRET_KEY" | cut -c1-5))"; exit 1;; esac
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Database Firestore (crea se manca)
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          PID=$(node -p "JSON.parse(require('fs').readFileSync('$RUNNER_TEMP/sa.json','utf8')).project_id")
          echo "::notice title=Firebase progetto::$PID"
          npm i -g firebase-tools@14 --no-audit --no-fund >/dev/null
          if firebase firestore:databases:list --project "$PID" --json 2>/dev/null | grep -q '(default)'; then echo "database presente"
          else
            gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" -q 2>/dev/null || true
            gcloud services enable firestore.googleapis.com --project "$PID" -q 2>&1 | tail -2 | tr '\n' ' ' > svc.log || true
            sleep 20
            if gcloud firestore databases create --location=eur3 --project "$PID" -q > db.log 2>&1 || firebase firestore:databases:create '(default)' --location eur3 --project "$PID" --non-interactive >> db.log 2>&1; then echo "::notice title=Firestore::database creato (eur3)"
            else echo "::warning title=Firestore::non creato · servizi: $(cat svc.log | cut -c1-300) · errore: $(tail -c 500 db.log | tr '\n' ' ')"; fi
          fi
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Primo deploy
        working-directory: socialglass
        run: |
          npm i -g vercel@latest >/dev/null
          vercel link --yes --project "$PROJECT" --token "$VERCEL_TOKEN" >/dev/null
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" > ../url1.txt
      - name: Dominio, webhook Stripe e variabili
        working-directory: socialglass
        run: |
          set -e
          PID=$(node -p "require('./.vercel/project.json').projectId"); TEAM=$(node -p "require('./.vercel/project.json').orgId")
          Q="teamId=$TEAM"; case "$TEAM" in team_*) ;; *) Q="";; esac
          DOM=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$PID/domains?$Q" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=(JSON.parse(s).domains||[]).map(x=>x.name);const c=d.find(x=>!x.endsWith('.vercel.app'))||d[0]||'';console.log(c)})")
          [ -n "$DOM" ] || DOM=$(sed 's#https://##' ../url1.txt)
          URL="https://$DOM"; echo "URL=$URL" >> $GITHUB_ENV
          setenv(){ K="$1" V="$2" node -e 'process.stdout.write(JSON.stringify({key:process.env.K,value:process.env.V,type:"encrypted",target:["production","preview"]}))' > "$RUNNER_TEMP/env.json"
            curl -s -o /dev/null -w "$1 %{http_code}\n" -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            "https://api.vercel.com/v10/projects/$PID/env?upsert=true&$Q" --data-binary @"$RUNNER_TEMP/env.json"; rm -f "$RUNNER_TEMP/env.json"; }
          # SESSION_SECRET: generato una volta sola
          HAS=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$PID/env?$Q" | grep -c '"key":"SESSION_SECRET"' || true)
          [ "$HAS" != "0" ] || setenv SESSION_SECRET "$(openssl rand -hex 32)"
          setenv SITE_URL "$URL"
          [ -z "$AIRTABLE_TOKEN" ] || setenv AIRTABLE_TOKEN "$AIRTABLE_TOKEN"
          [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || setenv FIREBASE_SERVICE_ACCOUNT "$FIREBASE_SERVICE_ACCOUNT"
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            setenv STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
            HOOK="$URL/api/stripe-webhook"
            # un solo webhook per questo indirizzo: il vecchio viene sostituito (il segreto si legge solo alla creazione)
            for id in $(curl -s -u "$STRIPE_SECRET_KEY:" "https://api.stripe.com/v1/webhook_endpoints?limit=100" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{for(const w of JSON.parse(s).data||[]) if(w.url==='$HOOK') console.log(w.id)})"); do
              curl -s -o /dev/null -u "$STRIPE_SECRET_KEY:" -X DELETE "https://api.stripe.com/v1/webhook_endpoints/$id"; done
            WH=$(curl -s -u "$STRIPE_SECRET_KEY:" https://api.stripe.com/v1/webhook_endpoints -d url="$HOOK" -d description="SocialGlass" \
              -d "enabled_events[]=checkout.session.completed" -d "enabled_events[]=invoice.paid" -d "enabled_events[]=invoice.payment_failed" -d "enabled_events[]=customer.subscription.deleted" \
              | node -p "const j=JSON.parse(require('fs').readFileSync(0));j.secret||''")
            [ -n "$WH" ] || { echo "::error::Webhook Stripe non creato: controlla la chiave"; exit 1; }
            setenv STRIPE_WEBHOOK_SECRET "$WH"
          fi
      - name: Deploy finale con le variabili
        working-directory: socialglass
        run: |
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" >/dev/null
          sleep 5; H=$(curl -s "$URL/api/health"); echo "health: $H"
          echo "::notice title=SocialGlass online::$URL  ·  health $H"
