name: socialglass-prova
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/sg-prova.mjs", ".github/workflows/socialglass-prova.yml"]
  workflow_run:
    workflows: [socialglass-deploy, socialglass-chiave]
    types: [completed]
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/sg-prova.mjs
