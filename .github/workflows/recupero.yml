name: Recupero vecchi siti
on:
  workflow_dispatch:
  push:
    branches: [recupero]
    paths: ["scripts/recupero.py", ".github/workflows/recupero.yml"]
permissions:
  contents: write
concurrency:
  group: recupero
  cancel-in-progress: true
jobs:
  recupero:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y whois >/dev/null
      - run: python3 scripts/recupero.py > recupero-log.txt 2>&1
        continue-on-error: true
      - name: Riepilogo
        if: always()
        run: |
          python3 - <<'PY'
          import json
          r = json.load(open("recupero/report.json"))
          for d, v in r.items():
              if d.startswith("_"): continue
              print(f"::notice title={d}::indice {v.get('file_archiviati')} · pagine {v.get('pagine_recuperate')} · file {v.get('file_recuperati')} · home {len(v.get('istantanee_home', []))} · err {v.get('errore_indice','')[:80]} {v.get('errore_istantanee','')[:80]}")
          PY
          du -sh recupero; find recupero -type f | wc -l; find recupero -size +40M
      - name: Salva risultati
        if: always()
        run: |
          git config user.name "recupero-bot"; git config user.email "bot@occhialesubito.com"
          find recupero -type f -size +40M -delete
          git add -A recupero recupero-log.txt 2>add.err || echo "::error::add $(tail -c 600 add.err | tr '\n' ' ')"
          git commit -qm "Risultati recupero siti" 2>commit.err || echo "::warning::commit $(tail -c 400 commit.err | tr '\n' ' ')"
          if ! git push -f origin HEAD:refs/heads/recupero-dati 2>push.err; then
            # se GitHub trova ancora un segreto, toglie solo quei file e riprova
            grep -oE 'path: [^:]+' push.err | sed 's/path: //' | sort -u > blocked.txt || true
            echo "::warning::file esclusi per segreti: $(tr '\n' ' ' < blocked.txt)"
            if [ -s blocked.txt ]; then
              xargs -a blocked.txt git rm -q --cached
              xargs -a blocked.txt rm -f
              git commit -q --amend -m "Risultati recupero siti"
              git push -f origin HEAD:refs/heads/recupero-dati 2>push2.err || { echo "::error::push2 $(tail -c 900 push2.err | tr '\n' ' ')"; exit 1; }
            else
              echo "::error::push $(tail -c 900 push.err | tr '\n' ' ')"; exit 1
            fi
          fi
