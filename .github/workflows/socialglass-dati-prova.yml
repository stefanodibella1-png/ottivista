name: socialglass-dati-prova
# Crea o elimina i dati di prova (solo a mano): cliente moroso e clienti per le funzioni servizio
on:
  workflow_dispatch:
    inputs:
      azione: { description: "crea, elimina, clienti-crea, clienti-elimina oppure diagnosi-lab (sola lettura)", required: true, default: "crea" }
permissions: { contents: read }
jobs:
  moroso:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd socialglass && npm i --no-audit --no-fund >/dev/null
      - env: { AZIONE: "${{ github.event.inputs.azione }}" }
        run: case "$AZIONE" in crea|elimina) node scripts/sg-moroso-prova.cjs "$AZIONE";; clienti-crea) node scripts/sg-clienti-prova.cjs crea;; clienti-elimina) node scripts/sg-clienti-prova.cjs elimina;; diagnosi-lab) node scripts/sg-lab-diagnosi.cjs;; *) echo "azione non valida"; exit 1;; esac
