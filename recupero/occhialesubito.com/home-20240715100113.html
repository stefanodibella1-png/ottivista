  <script>
    function isDesktop() {
      return window.innerWidth > 768;

    if (isDesktop()) {
      const immagineCadente1 = document.getElementById('immagineCadente1');
      const immagineCadente2 = document.getElementById('immagineCadente2');
      const altezzaFinestra = window.innerHeight;

      let posizione1 = 0;
      let posizione2 = 0;
      let rotazione2 = 0;

      const velocita = 2;
      const puntoPartenza = 20;
      const velocitaRotazione = 5;
      const rotazioneFermata = 0;

      const leftImmagineCadente2 = 75;
      const topImmagineCadente2 = 74;

      immagineCadente1.style.top = puntoPartenza + 'px';

      function animaImmagine1() {
        if (posizione1 < altezzaFinestra - immagineCadente1.clientHeight) {
          posizione1 += velocita;
          immagineCadente1.style.top = posizione1 + 'px';
          requestAnimationFrame(animaImmagine1);
        } else {
          immagineCadente2.style.display = 'block';
          immagineCadente2.style.left = leftImmagineCadente2 + '%';
          immagineCadente2.style.top = puntoPartenza + 'px';
          animaImmagine2();
        }
      }

      function animaImmagine2() {
        const puntoFermata2 = immagineCadente1.offsetTop + immagineCadente1.clientHeight * topImmagineCadente2 / 100;
        if (posizione2 < puntoFermata2 - immagineCadente2.clientHeight) {
          posizione2 += velocita;
          rotazione2 += velocitaRotazione;
          immagineCadente2.style.top = posizione2 + 'px';
          immagineCadente2.style.transform = `translateX(-50%) rotate(${rotazione2}deg)`;
          requestAnimationFrame(animaImmagine2);
        } else {
          immagineCadente2.style.transform = `translateX(-50%) rotate(${rotazioneFermata}deg)`;
        }
      }

      animaImmagine1();
    }

<script src="https://unpkg.com/axios/dist/axios.min.js"></script>

<script>
  const apiKey = '[OSCURATO]';
  const apiUrl = 'https://api.airtable.com/v0/appLcON9vtvu5Cpj8/tbluV4ZA9v244YHp1';
  let codeReader = null;

  async function checkPasswordInAirtable(codice) {
    const response = await axios.get(apiUrl, {
      headers: {
        'Authorization': `Bearer ${apiKey}`
      },
      params: {
        filterByFormula: `AND(Codice = "${codice}", Stato = "DISPONIBILE")`
      }
    });

    if (response.data.records.length > 0) {
      return {
        isPresent: true,
        modello: response.data.records[0].fields.Modello,
        colore: response.data.records[0].fields.Colore,
        calibro: response.data.records[0].fields.Calibro,
		asse: response.data.records[0].fields.Asse
      };
    } else {
      return { isPresent: false };
    }
  }

  function startScanner() {
    if (codeReader) {
      codeReader.reset();
    } else {
      codeReader = new ZXing.BrowserQRCodeReader();
    }

    const video = document.getElementById('preview');
    codeReader.decodeFromVideoDevice(undefined, 'preview', async (result, error) => {
      if (result) {
        codeReader.reset();
        document.getElementById('video-container').style.display = 'none';

        const qrText = document.getElementById('qr-text');
        const qrBtn = document.getElementById('qr-btn');
		 const urlParams = new URLSearchParams(window.location.search);
         const promotore = urlParams.get('promotore'); 
        const urlespositore = new URLSearchParams(window.location.search);
        const espositore = urlespositore.get('espositore');

        const { isPresent, modello, colore, calibro, asse } = await checkPasswordInAirtable(result.text);
        if (isPresent) {
          qrText.innerHTML = `MONTATURA DISPONIBILE<br>Modello: ${modello ? modello : ''}<br>Colore: ${colore ? colore : ''}<br>Calibro: ${calibro ? calibro : ''}<br>Asse: ${asse ? asse : ''}`;
          qrBtn.textContent = 'CONTINUA';
          qrBtn.style.display = 'block';
          qrBtn.onclick = function() {
           window.open(`https://occhialesubito.com/Codice?id=${result.text}&img=biottica&modello=${modello}&colore=${colore}&calibro=${calibro}&asse=${asse}&espositore=${espositore}&promotore=${promotore}`, '_self');


          };
        } else {
          qrText.textContent = 'CODICE NON VALIDO - \n MONTATURA NON DISPONIBILE';
          qrBtn.style.display = 'none';
        }
        document.getElementById('popup').style.display = 'block';
      }

      if (error && !(error instanceof ZXing.NotFoundException)) {
        console.error('Errore durante la scansione del codice QR', error);
      }
    });
  }

  document.getElementById('scan-btn').addEventListener('click', function() {
    document.getElementById('video-container').style.display = 'block';
    startScanner();
  });

  document.getElementById('close-video-btn').addEventListener('click', function() {
    if (codeReader) {
      codeReader.reset();
    }
    document.getElementById('video-container').style.display = 'none';
  });

  document.getElementById('close-btn').addEventListener('click', function() {
    document.getElementById('popup').style.display = 'none';
  });


function dropImage(startY, endY) {
  const immagineCadente1 = document.getElementById('immagineCadente1');
  const velocitaCaduta = 2; // Puoi regolare la velocità della caduta come desideri
  let posizioneY = startY;

  function animate() {
    if (posizioneY < endY) {
      posizioneY += velocitaCaduta;
      immagineCadente1.style.top = posizioneY + 'px';
      requestAnimationFrame(animate);
    }
  }

  animate();
}

// Chiamiamo la funzione dropImage() con il punto di partenza e di conclusione desiderati
window.addEventListener('load', function () {
  dropImage(-200, 140); 
});

	top:10px;
	text-decoration:none;
	box-shadow:none;

.codedropz-upload-handler {

.codedropz-upload-container {

}

	width:100%;

	text-overflow: ellipsis;
	font-weight:inherit;
}
.codedropz-upload-inner .codedropz-btn-wrap a.cd-upload-btn {
	text-decoration:none;

}

	margin:5px 0;
	font-size:30px;
	line-height:32px;

}

	display:inline-block;
	color:#ff0000;
	padding:5px 0;
	font-style:italic;
}

.wpcf7-form label.error-new {

    float: none;
    padding-left: 5px;

}
