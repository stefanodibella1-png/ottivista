<head>

<style>
/* Stile: illustrazione piatta e colorata su bianco; tricolore del logo come filo conduttore */
:root{
  --ink:#1B1B22; --muted:#6B6A75; --line:#ECEAF0; --soft:#F7F5F2; --white:#FFFFFF;
  --blue:#5B7BB8; --orange:#F2704E; --green:#8DB04A; --yellow:#F2D96B; --plum:#5E2747; --skin:#F6A98C; --teal:#2F6E73;
  --it-green:#159A4B; --it-red:#D3264F;
  --f-head:"Nunito", "Arial Rounded MT Bold", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Nunito Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--white);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* testata */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;gap:14px;height:64px}
.brand img{height:34px;width:auto}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:999px;padding:0 14px;height:42px;min-width:0}
.search input{border:0;background:transparent;font:inherit;width:100%;outline:none;min-width:0}
.search svg{width:18px;height:18px;flex:0 0 auto;color:var(--muted)}
.cartBtn{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;cursor:pointer;text-decoration:none;flex:0 0 auto}
.cartBtn svg{width:21px;height:21px}
.cartBtn b{position:absolute;top:-3px;right:-3px;background:var(--orange);color:#fff;font:800 11px var(--f-head);min-width:20px;height:20px;border-radius:999px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.tricolor{height:4px;background:linear-gradient(90deg,var(--it-green) 0 33.3%,#fff 33.3% 66.6%,var(--it-red) 66.6%);border-bottom:1px solid var(--line)}
@media (max-width:560px){ .brand img{height:26px} header .wrap{gap:10px} }

/* home */
.hero{background:var(--soft)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:40px 36px}
.hero h1{font-family:var(--f-head);font-weight:900;font-size:clamp(34px,5.4vw,58px);line-height:1.02;letter-spacing:-.02em;margin:0 0 14px;text-wrap:balance}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--yellow) 62%)}
.hero p{font-size:18px;color:var(--muted);margin:0 0 22px;max-width:46ch}
.ctas{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 22px;font:800 16px var(--f-head);text-decoration:none;cursor:pointer;border:2px solid var(--ink);background:#fff;color:var(--ink)}
.btn.dark{background:var(--ink);color:#fff}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.btn svg{width:20px;height:20px}
.btn:disabled{opacity:.45;cursor:default}
.perks{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;font-weight:700;font-size:14px}
.perks span{display:inline-flex;align-items:center;gap:7px}
.perks i{width:10px;height:10px;border-radius:50%;display:inline-block}
.hero svg.ill{width:100%;height:auto;max-width:520px;justify-self:center}
@media (max-width:820px){ .hero .wrap{grid-template-columns:1fr;padding-block:26px} .hero svg.ill{max-width:380px;order:-1} }

.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding-block:28px 8px}
.how div{border-radius:20px;padding:18px;display:grid;gap:4px}
.how b{font:900 20px var(--f-head)}
.how span{color:var(--ink);opacity:.8;font-size:15px}
.how div:nth-child(1){background:#E9EFFA} .how div:nth-child(2){background:#FDEBE5} .how div:nth-child(3){background:#EEF5E1}
.how small{font:800 13px var(--f-head);letter-spacing:.06em;text-transform:uppercase;opacity:.6}
@media (max-width:720px){ .how{grid-template-columns:1fr} }

.shelf{padding-block:26px 50px}
.shelf h2{font:900 28px var(--f-head);margin:0 0 12px;letter-spacing:-.01em}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:700 14px var(--f-head);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.ar[aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 14px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.meta select{font:inherit;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
@media (max-width:480px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px} }
.card{display:grid;gap:6px;text-decoration:none;color:inherit;border-radius:18px;padding:10px;background:#fff;border:1px solid var(--line);position:relative;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card .ph{aspect-ratio:4/3;border-radius:12px;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.card .ph img{width:92%;height:auto;object-fit:contain;mix-blend-mode:multiply}
.card .nm{font:800 16px var(--f-head);line-height:1.2}
.card .sz{font-size:12.5px;color:var(--muted)}
.card .pr{display:flex;align-items:baseline;gap:8px}
.card .pr b{font:900 18px var(--f-head)}
.card .pr s{color:var(--muted);font-size:13px}
.badge{position:absolute;top:16px;left:16px;font:800 11px var(--f-head);letter-spacing:.04em;padding:4px 8px;border-radius:999px;background:var(--blue);color:#fff;display:inline-flex;gap:5px;align-items:center}
.badge svg{width:13px;height:13px}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.more{display:flex;justify-content:center;margin-top:22px}

/* scheda prodotto */
.pp{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;padding-block:22px 60px;align-items:start}
@media (max-width:860px){ .pp{grid-template-columns:1fr} }
.crumb{font-size:14px;color:var(--muted);padding-top:16px}
.crumb a{text-decoration:none;font-weight:700;color:var(--ink)}
.gal{display:grid;gap:10px}
.gal .main{aspect-ratio:4/3;border-radius:20px;background:var(--soft);display:grid;place-items:center;overflow:hidden;position:relative}
.gal .main img{width:94%;height:auto;object-fit:contain;mix-blend-mode:multiply}
.thumbs{display:flex;gap:8px;overflow-x:auto}
.thumbs button{flex:0 0 auto;width:78px;aspect-ratio:4/3;border-radius:10px;border:2px solid transparent;background:var(--soft);padding:0;cursor:pointer;overflow:hidden}
.thumbs button[aria-pressed="true"]{border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.info h1{font:900 34px var(--f-head);margin:0;letter-spacing:-.01em}
.info .price{display:flex;align-items:baseline;gap:10px;margin:6px 0 4px}
.info .price b{font:900 30px var(--f-head)}
.info .price s{color:var(--muted)}
.info .incl{font-size:14px;color:var(--muted);margin:0 0 14px}
.tryon{display:flex;align-items:center;gap:12px;background:#E9EFFA;border-radius:16px;padding:12px 14px;margin:6px 0 18px;text-decoration:none;color:var(--ink)}
.tryon svg{width:36px;height:36px;flex:0 0 auto;color:var(--blue)}
.tryon b{font:900 17px var(--f-head);display:block}
.tryon span{font-size:13.5px;color:var(--muted)}
.tryon.off{background:var(--soft)}
.specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 18px}
.specs div{border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.specs b{display:block;font:900 18px var(--f-head)}
.specs span{font-size:12px;color:var(--muted)}
fieldset{border:0;margin:0 0 16px;padding:0;display:grid;gap:8px}
legend{font:900 18px var(--f-head);margin-bottom:6px;padding:0}
.opt{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--ink)}
.opt input{accent-color:var(--ink);width:18px;height:18px;flex:0 0 auto}
.opt .t{flex:1;min-width:0}
.opt .t b{font:800 15px var(--f-head);display:block}
.opt .t span{font-size:13px;color:var(--muted)}
.opt .p{font:800 15px var(--f-head);white-space:nowrap}
.rx{display:grid;gap:8px;background:var(--soft);border-radius:14px;padding:12px}
.rx table{width:100%;border-collapse:collapse;font-size:14px}
.rx th{font:800 12px var(--f-head);color:var(--muted);text-align:left;padding:2px 4px}
.rx td{padding:3px 4px}
.rx input,.rx select{width:100%;font:inherit;font-size:14px;padding:7px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:0}
.rx .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rx .row label{font-size:14px;font-weight:700}
.rx .row input{width:90px}
.note{font-size:13px;color:var(--muted);margin:0}
.desc{font-size:14.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:18px}
.add{position:sticky;bottom:0;background:#fff;padding:12px 0 calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);margin-top:10px}
.add .tot{font:900 22px var(--f-head);flex:1}
.add .tot small{display:block;font:600 12px var(--f-body);color:var(--muted)}

/* carrello */
.cartp{padding-block:22px 60px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:860px){ .cartp{grid-template-columns:1fr} }
.cartp h1{font:900 30px var(--f-head);margin:0 0 12px}
.line{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}
.line img{width:96px;aspect-ratio:4/3;object-fit:contain;background:var(--soft);border-radius:10px;mix-blend-mode:multiply}
.line .t{flex:1;min-width:0}
.line .t b{font:800 16px var(--f-head);display:block}
.line .t span{font-size:13px;color:var(--muted);display:block}
.line .p{font:900 17px var(--f-head);white-space:nowrap}
.line button{border:0;background:none;color:var(--it-red);font-weight:700;cursor:pointer;padding:4px 0;font-size:13px}
.box{border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:10px}
.box h2{font:900 20px var(--f-head);margin:0}
.sum{display:flex;justify-content:space-between;font-size:15px}
.sum.big{font:900 22px var(--f-head);border-top:1px solid var(--line);padding-top:10px}
.box label{display:grid;gap:4px;font-size:13.5px;font-weight:700}
.box input,.box textarea{font:inherit;font-weight:400;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
.box .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;z-index:50;max-width:calc(100% - 32px)}
.toast:empty{display:none}
.proto{background:var(--yellow);font-size:13px;font-weight:700;text-align:center;padding:6px 16px}

footer{background:var(--ink);color:#d9d7e0;padding-block:30px calc(env(safe-area-inset-bottom,0px) + 30px)}
footer .wrap{display:grid;gap:12px}
footer .fl{font:900 26px var(--f-head);color:#fff;letter-spacing:-.01em;display:inline-block;padding-bottom:6px;background:linear-gradient(90deg,var(--it-green) 0 33.3%,#fff 33.3% 66.6%,var(--it-red) 66.6%) bottom/100% 4px no-repeat;justify-self:start}
footer p{margin:0;font-size:14px;max-width:70ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      <h2>Montature</h2>
      <div class="chips" id="chips"></div>
      <div class="meta"><span id="count"></span>
        <label>Ordina <select id="sort"><option value="ar">Prova virtuale prima</option><option value="pa">Prezzo crescente</option><option value="pd">Prezzo decrescente</option><option value="new">Novità</option></select></label>
      </div>
      <div class="grid" id="grid"></div>
      <div class="more"><button class="btn" id="moreBtn" hidden>Mostra altre</button></div>
    </div>
  </section>
</template>

<script>
(() => {
"use strict";
/* ---------- impostazioni del negozio ---------- */
const CONFIG = {
  markup: 3,                 // prezzo fornitore (montatura + lenti base) × ricarico
  minPrice: 29.9,            // prezzo minimo di vendita in euro
  shipping: 6.9,             // spedizione in euro
  freeShippingFrom: 79,
  whatsapp: "393891640545",  // numero WhatsApp del negozio che riceve gli ordini
  lenses: [
    {id:"mono", name:"Monofocali base", desc:"Lontano o vicino, indice 1.5", price:0},
    {id:"mono16", name:"Monofocali sottili", desc:"Indice 1.61, per gradazioni medie", price:25},
    {id:"prog", name:"Progressive", desc:"Lontano e vicino nella stessa lente", price:69},
    {id:"none", name:"Senza correzione", desc:"Solo protezione, lenti neutre", price:0}
  ],
  extras: [
    {id:"ar", name:"Antiriflesso", price:9},
    {id:"blue", name:"Filtro luce blu", price:15},
    {id:"photo", name:"Fotocromatiche", price:35},
    {id:"sun", name:"Lenti da sole colorate", price:19}
  ]
};
const $ = s => document.querySelector(s);
const app = $("#app");
const fmt = v => v.toLocaleString("it-IT", {style:"currency", currency:"EUR"});
let CAT = null, toastT = 0;
function toast(t){ $("#toast").textContent = t; clearTimeout(toastT); toastT = setTimeout(() => $("#toast").textContent = "", 2600); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function priceOf(it){
  const eur = it.priceGBP*(CAT.gbpEur || 1.17)*CONFIG.markup;
  return Math.max(CONFIG.minPrice, Math.ceil(eur/5)*5 - .1);
}
function img(src, w){ return src ? src.replace(/(\?.*)?$/, (m) => (m ? m + "&" : "?") + "width=" + w) : ""; }
const AR_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="13" r="3.5"/><circle cx="17.5" cy="13" r="3.5"/><path d="M10 12.5c1.2-1 2.8-1 4 0"/></svg>';

/* ---------- carrello ---------- */
const cart = {
  get(){ try { return JSON.parse(localStorage.getItem("os_cart") || "[]"); } catch(e){ return []; } },
  set(l){ try { localStorage.setItem("os_cart", JSON.stringify(l)); } catch(e){} badge(); }
};
function badge(){ const n = cart.get().length; $("#cartN").textContent = n; $("#cartN").hidden = !n; }

/* ---------- home ---------- */
const UI = {cat:"Tutti", ar:false, sort:"ar", q:"", shown:24};
function filtered(){
  const q = UI.q.trim().toLowerCase();
  let l = CAT.items.filter(i => i.images.length);
  if (UI.cat !== "Tutti") l = l.filter(i => i.cats.includes(UI.cat));
  if (UI.ar) l = l.filter(i => i.ar);
  if (q) l = l.filter(i => (i.name + " " + i.colors.join(" ") + " " + i.cats.join(" ")).toLowerCase().includes(q));
  const s = UI.sort;
  l = [...l];
  if (s === "pa") l.sort((a, b) => priceOf(a) - priceOf(b));
  else if (s === "pd") l.sort((a, b) => priceOf(b) - priceOf(a));
  else if (s === "new") l.sort((a, b) => String(b.updated).localeCompare(String(a.updated)));
  else l.sort((a, b) => (b.ar ? 1 : 0) - (a.ar ? 1 : 0));
  return l;
}
function card(i){
  const p = priceOf(i);
  return `<a class="card" href="#/p/${encodeURIComponent(i.handle)}">
    <div class="ph"><img loading="lazy" src="${esc(img(i.images[0], 480))}" alt="${esc(i.name)}"></div>
    ${i.ar ? `<span class="badge">${AR_ICON}Prova AR</span>` : ""}
    <div class="nm">${esc(i.name)}</div>
    <div class="sz">${i.size ? `${i.size.lens}□${i.size.bridge}-${i.size.temple || ""}` : "&nbsp;"}${i.colors.length ? " · " + esc(i.colors.join(", ")) : ""}</div>
    <div class="pr"><b>${fmt(p)}</b><span class="sz">lenti incluse</span></div>
  </a>`;
}
function renderGrid(){
  const l = filtered();
  $("#count").textContent = `${l.length} montature${UI.ar ? " con prova virtuale" : ""}`;
  $("#grid").innerHTML = l.length ? l.slice(0, UI.shown).map(card).join("") : '<div class="empty">Nessuna montatura con questi filtri.</div>';
  $("#moreBtn").hidden = l.length <= UI.shown;
}
function home(){
  app.innerHTML = $("#tHome").innerHTML;
  const cats = ["Tutti", ...["Donna","Uomo","Sole","Tondi","Quadrati","Rettangolari","Cat-eye","Aviator","Metallo","Acetato","Bambino"].filter(c => CAT.items.some(i => i.cats.includes(c)))];
  $("#chips").innerHTML = `<button class="chip ar" data-ar="1" aria-pressed="${UI.ar}">${"Con prova AR"}</button>` + cats.map(c => `<button class="chip" data-c="${esc(c)}" aria-pressed="${c === UI.cat}">${esc(c)}</button>`).join("");
  $("#chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    if (b.dataset.ar){ UI.ar = !UI.ar; b.setAttribute("aria-pressed", UI.ar); }
    else { UI.cat = b.dataset.c; [...$("#chips").querySelectorAll("[data-c]")].forEach(x => x.setAttribute("aria-pressed", x === b)); }
    UI.shown = 24; renderGrid();
  });
  $("#sort").value = UI.sort;
  $("#sort").addEventListener("change", e => { UI.sort = e.target.value; renderGrid(); });
  $("#moreBtn").addEventListener("click", () => { UI.shown += 24; renderGrid(); });
  renderGrid();
}

/* ---------- prodotto ---------- */
function product(handle){
  const it = CAT.items.find(i => i.handle === handle);
  if (!it){ app.innerHTML = '<div class="wrap empty">Montatura non trovata. <a href="#/">Torna al catalogo</a></div>'; return; }
  const base = priceOf(it);
  const sz = it.size;
  app.innerHTML = `<div class="wrap">
    <div class="crumb"><a href="#/">Montature</a> › ${esc(it.name)}</div>
    <div class="pp">
      <div class="gal">
        <div class="main"><img id="mainImg" src="${esc(img(it.images[0], 1000))}" alt="${esc(it.name)}"></div>
        <div class="thumbs" id="thumbs">${it.images.map((s, k) => `<button aria-pressed="${k === 0}" data-k="${k}" aria-label="Foto ${k+1}"><img loading="lazy" src="${esc(img(s, 200))}" alt=""></button>`).join("")}</div>
      </div>
      <div class="info">
        <h1>${esc(it.name)}</h1>
        <div class="price"><b>${fmt(base)}</b></div>
        <p class="incl">Montatura con lenti monofocali base e custodia incluse.${it.colors.length ? " Colore: " + esc(it.colors.join(", ")) + "." : ""}</p>
        ${it.ar ? `<a class="tryon" href="../index.html?shop=${encodeURIComponent(it.handle)}">${AR_ICON}<div><b>Provala addosso</b><span>Con la fotocamera del telefono, in tempo reale</span></div></a>`
                : `<div class="tryon off">${AR_ICON}<div><b>Prova virtuale in arrivo</b><span>Per questo modello non è ancora disponibile</span></div></div>`}
        ${sz ? `<div class="specs"><div><b>${sz.lens}</b><span>Lente mm</span></div><div><b>${sz.bridge}</b><span>Ponte mm</span></div><div><b>${sz.temple || "—"}</b><span>Asta mm</span></div>${sz.front ? `<div><b>${sz.front}</b><span>Frontale mm</span></div>` : ""}${sz.height ? `<div><b>${sz.height}</b><span>Altezza lente mm</span></div>` : ""}</div>` : ""}
        <form id="cfg">
          <fieldset><legend>Lenti</legend>
            ${CONFIG.lenses.map((l, k) => `<label class="opt"><input type="radio" name="lens" value="${l.id}" ${k === 0 ? "checked" : ""}><span class="t"><b>${l.name}</b><span>${l.desc}</span></span><span class="p">${l.price ? "+" + fmt(l.price) : "incluse"}</span></label>`).join("")}
          </fieldset>
          <fieldset><legend>Trattamenti</legend>
            ${CONFIG.extras.map(x => `<label class="opt"><input type="checkbox" name="extra" value="${x.id}"><span class="t"><b>${x.name}</b></span><span class="p">+${fmt(x.price)}</span></label>`).join("")}
          </fieldset>
          <fieldset id="rxSet"><legend>La tua ricetta</legend>
            <label class="opt"><input type="radio" name="rxmode" value="now" checked><span class="t"><b>La inserisco adesso</b></span></label>
            <label class="opt"><input type="radio" name="rxmode" value="later"><span class="t"><b>La invio dopo l'ordine</b><span>Foto della ricetta su WhatsApp o email</span></span></label>
            <div class="rx" id="rx">
              <table><thead><tr><th></th><th>SFERO</th><th>CILINDRO</th><th>ASSE</th><th>ADD</th></tr></thead><tbody>
                ${["OD","OS"].map(e => `<tr><th>${e === "OD" ? "Destro" : "Sinistro"}</th>${["sph","cyl","axis","add"].map(f => `<td><input name="${e}_${f}" inputmode="decimal" placeholder="${f === "axis" ? "0-180" : "0.00"}" aria-label="${e} ${f}"></td>`).join("")}</tr>`).join("")}
              </tbody></table>
              <div class="row"><label for="pd">Distanza pupillare (PD)</label><input id="pd" name="pd" inputmode="decimal" placeholder="es. 63"><span class="note">mm · la misura anche la prova virtuale</span></div>
            </div>
          </fieldset>
          <p class="note">Prima della produzione un ottico optometrista controlla ogni ricetta e ti contatta in caso di dubbi.</p>
          <div class="add"><div class="tot" id="tot"></div><button class="btn orange" type="submit">Aggiungi al carrello</button></div>
        </form>
        ${it.desc ? `<div class="desc">${esc(it.desc)}</div>` : ""}
      </div>
    </div></div>`;
  $("#thumbs").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    $("#mainImg").src = img(it.images[+b.dataset.k], 1000);
    [...$("#thumbs").children].forEach(x => x.setAttribute("aria-pressed", x === b));
  });
  const f = $("#cfg");
  try { const pd = localStorage.getItem("ov_pd"); if (pd && JSON.parse(pd)) f.pd.value = JSON.parse(pd); } catch(e){}
  const calc = () => {
    const lens = CONFIG.lenses.find(l => l.id === f.lens.value);
    const ex = [...f.querySelectorAll("[name=extra]:checked")].map(x => CONFIG.extras.find(y => y.id === x.value));
    const total = base + lens.price + ex.reduce((s, x) => s + x.price, 0);
    $("#tot").innerHTML = `${fmt(total)}<small>${esc(lens.name)}${ex.length ? " + " + ex.map(x => x.name).join(", ") : ""}</small>`;
    const noRx = lens.id === "none";
    $("#rxSet").hidden = noRx;
    $("#rx").hidden = noRx || f.rxmode.value !== "now";
    f.querySelectorAll("[name$=_add]").forEach(x => x.disabled = lens.id !== "prog");
    return {lens, ex, total};
  };
  f.addEventListener("change", calc); calc();
  f.addEventListener("submit", e => {
    e.preventDefault();
    const {lens, ex, total} = calc();
    const rx = {};
    if (lens.id !== "none" && f.rxmode.value === "now"){
      for (const k of ["OD_sph","OD_cyl","OD_axis","OD_add","OS_sph","OS_cyl","OS_axis","OS_add","pd"]) if (f[k].value.trim()) rx[k] = f[k].value.trim().replace(",", ".");
      if (!rx.OD_sph && !rx.OS_sph){ toast("Inserisci almeno lo sfero, oppure scegli «La invio dopo»"); return; }
      if (!rx.pd){ toast("Inserisci la distanza pupillare (PD)"); f.pd.focus(); return; }
    }
    const l = cart.get();
    l.push({handle:it.handle, name:it.name, image:it.images[0], size:it.size, lens:lens.name, extras:ex.map(x => x.name), rxLater: lens.id !== "none" && f.rxmode.value === "later", rx, price:total});
    cart.set(l); toast(`${it.name} aggiunta al carrello`);
    setTimeout(() => location.hash = "#/carrello", 600);
  });
  window.scrollTo(0, 0);
}

/* ---------- carrello e ordine ---------- */
function cartPage(){
  const l = cart.get();
  const sub = l.reduce((s, x) => s + x.price, 0);
  const ship = !l.length || sub >= CONFIG.freeShippingFrom ? 0 : CONFIG.shipping;
  let saved = {}; try { saved = JSON.parse(localStorage.getItem("os_cust") || "{}"); } catch(e){}
  app.innerHTML = `<div class="wrap cartp">
    <div><h1>Carrello</h1>
      ${l.length ? l.map((x, k) => `<div class="line"><img src="${esc(img(x.image, 240))}" alt=""><div class="t"><b>${esc(x.name)}</b><span>${esc(x.lens)}${x.extras.length ? " · " + esc(x.extras.join(", ")) : ""}</span><span>${x.rxLater ? "Ricetta da inviare" : Object.keys(x.rx).length ? "Ricetta inserita" : ""}</span><button data-k="${k}">Rimuovi</button></div><div class="p">${fmt(x.price)}</div></div>`).join("")
        : '<div class="empty">Il carrello è vuoto. <a href="#/">Scegli una montatura</a></div>'}
    </div>
    <form class="box" id="order" ${l.length ? "" : "hidden"}>
      <h2>Riepilogo</h2>
      <div class="sum"><span>Prodotti</span><span>${fmt(sub)}</span></div>
      <div class="sum"><span>Spedizione</span><span>${ship ? fmt(ship) : "gratis"}</span></div>
      <div class="sum big"><span>Totale</span><span>${fmt(sub + ship)}</span></div>
      <h2 style="margin-top:8px">I tuoi dati</h2>
      <label>Nome e cognome<input name="name" required autocomplete="name" value="${esc(saved.name)}"></label>
      <div class="two"><label>Telefono<input name="tel" required inputmode="tel" autocomplete="tel" value="${esc(saved.tel)}"></label><label>Email<input name="email" type="email" autocomplete="email" value="${esc(saved.email)}"></label></div>
      <label>Indirizzo di spedizione<textarea name="addr" rows="2" required autocomplete="street-address">${esc(saved.addr)}</textarea></label>
      <label>Note<textarea name="notes" rows="2"></textarea></label>
      <button class="btn orange" type="submit">Invia l'ordine su WhatsApp</button>
      <p class="note">Ti rispondiamo con la conferma e le istruzioni di pagamento. Nessun addebito ora.</p>
    </form>
  </div>`;
  app.querySelectorAll(".line button").forEach(b => b.addEventListener("click", () => { const c = cart.get(); c.splice(+b.dataset.k, 1); cart.set(c); cartPage(); }));
  const f = $("#order");
  f && f.addEventListener("submit", e => {
    e.preventDefault();
    const cust = {name:f.name.value.trim(), tel:f.tel.value.trim(), email:f.email.value.trim(), addr:f.addr.value.trim()};
    try { localStorage.setItem("os_cust", JSON.stringify(cust)); } catch(e){}
    const rxTxt = r => Object.keys(r).length ? `\n   OD sf ${r.OD_sph||"-"} cil ${r.OD_cyl||"-"} ax ${r.OD_axis||"-"}${r.OD_add ? " add " + r.OD_add : ""}\n   OS sf ${r.OS_sph||"-"} cil ${r.OS_cyl||"-"} ax ${r.OS_axis||"-"}${r.OS_add ? " add " + r.OS_add : ""}\n   PD ${r.pd||"-"}` : "";
    const lines = l.map((x, k) => `${k+1}. ${x.name} (${x.handle})${x.size ? " " + x.size.lens + "/" + x.size.bridge : ""}\n   ${x.lens}${x.extras.length ? " + " + x.extras.join(", ") : ""} · ${fmt(x.price)}${x.rxLater ? "\n   Ricetta: la invio dopo" : rxTxt(x.rx)}`).join("\n");
    const msg = `NUOVO ORDINE occhialesubito\n\n${lines}\n\nSpedizione: ${ship ? fmt(ship) : "gratis"}\nTOTALE: ${fmt(sub + ship)}\n\n${cust.name}\n${cust.tel}${cust.email ? " · " + cust.email : ""}\n${cust.addr}${f.notes.value.trim() ? "\nNote: " + f.notes.value.trim() : ""}`;
    window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");
  });
  window.scrollTo(0, 0);
}

/* ---------- router ---------- */
function route(){
  const h = location.hash || "#/";
  const m = h.match(/^#\/p\/(.+)$/);
  if (m) product(decodeURIComponent(m[1]));
  else if (h === "#/carrello") cartPage();
  else if (h === "#shelf"){ if (!$("#grid")) home(); $("#shelf").scrollIntoView({behavior:"smooth"}); }
  else home();
}
let qT = 0;
$("#q").addEventListener("input", e => {
  clearTimeout(qT); qT = setTimeout(() => {
    UI.q = e.target.value; UI.shown = 24;
    if (!$("#grid")){ location.hash = "#/"; }
    else { renderGrid(); $("#shelf").scrollIntoView({behavior:"smooth"}); }
  }, 200);
});
window.addEventListener("hashchange", route);
badge();
fetch("catalog.json", {cache:"no-cache"}).then(r => r.json()).then(c => { CAT = c; route(); })
  .catch(() => { app.innerHTML = '<div class="wrap empty">Catalogo in preparazione: riprova tra qualche minuto.</div>'; });
})();
</script>
</body>
</html>
