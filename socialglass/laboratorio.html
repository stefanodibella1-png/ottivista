<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Laboratorio · SocialGlass</title>
<style>
:root{--blu:#0069D9;--notte:#0A1F5C;--verde:#2E7D32;--testo:#1D2433;--grigio:#5B6475;--bordo:#DDE3EC;--fondo:#F4F6FB;--campo:#EEF4FF;--ombra:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.06)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:var(--testo);font-size:15px;line-height:1.5}
header{background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bordo);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:2}
header b{color:var(--notte);font-size:19px;letter-spacing:-.02em}header span{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:800;letter-spacing:.06em;padding:3px 10px;border-radius:999px;background:var(--notte);color:#fff;vertical-align:2px}
main{max-width:1040px;margin:0 auto;padding:14px 16px 40px;animation:sale .3s both}
@keyframes sale{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
button,.btn{font:inherit;border:1px solid transparent;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--blu);color:#fff;font-weight:600;line-height:1.3;transition:background-color .18s,transform .12s,border-color .18s,box-shadow .18s}
button:hover{background:#0052AA}button:active{transform:scale(.98)}button:focus-visible,summary:focus-visible{outline:3px solid #0052AA;outline-offset:2px}
button.verde{background:var(--verde)}button.verde:hover{background:#1B5E20}button.grigio{background:#e9edf2;color:#2b3445}button.grigio:hover{background:#dde2e9}button:disabled{opacity:.5;cursor:default}
button.link{background:none;color:#0058c4;padding:0;text-decoration:underline;font-weight:400;border:0}
input,select,textarea{font:inherit;font-size:16px;padding:11px 14px;border:1px solid var(--bordo);border-radius:12px;width:100%;background:#fff;box-shadow:var(--ombra)}
input:focus{border-color:var(--blu);box-shadow:0 0 0 4px rgba(0,105,217,.16);outline:none}
label{display:block;font-size:13px;color:var(--grigio);margin:8px 0 3px}
.card{background:#fff;border:1px solid var(--bordo);border-radius:18px;padding:18px;margin:10px 0;box-shadow:0 10px 28px rgba(16,24,40,.09)}
.login{max-width:380px;margin:9vh auto}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0 0 12px}
.kpi button{text-align:left;background:#fff;color:var(--grigio);border:1px solid var(--bordo);border-radius:14px;padding:12px 14px;font-size:13px;font-weight:500;box-shadow:var(--ombra)}
.kpi button:hover{background:#fff;border-color:var(--blu)}.kpi button.on{border-color:var(--blu);box-shadow:0 0 0 3px rgba(0,105,217,.16)}
.kpi b{display:block;font-size:26px;line-height:1.1;color:var(--notte);letter-spacing:-.02em}.kpi .att b{color:#b3261e}.kpi .ok b{color:var(--verde)}
.tabs{display:flex;gap:6px;margin:6px 0;overflow-x:auto;background:#e9edf4;padding:5px;border-radius:14px;scrollbar-width:thin}.tabs button{flex:0 0 auto;background:transparent;color:var(--grigio);font-weight:600;padding:8px 14px;border-radius:10px}.tabs button:hover{background:#fff;color:var(--notte)}.tabs button.on{background:var(--blu);color:#fff}
.barra{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:10px 0}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;background:#e9edf2;color:#333;margin:2px 4px 2px 0;white-space:nowrap}
.c-dafare{background:#fff4e0;color:#8a5a00}.c-lav{background:#e7f0ff;color:#0b4fb3}.c-pronto{background:#e8f5e9;color:#1e5e24}.c-rit{background:#fdecea;color:#b3261e}
details.busta{background:#fff;border:1px solid var(--bordo);border-radius:16px;margin:8px 0;box-shadow:var(--ombra);transition:box-shadow .18s,border-color .18s}details.busta:hover{border-color:#c5d3ea}
details.busta>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
details.busta>summary::-webkit-details-marker{display:none}details.busta[open]>summary{border-bottom:1px solid var(--bordo)}
.cod{font-family:"Courier New",monospace;color:#555;font-size:13px}
.corpo{padding:12px 14px 14px;display:grid;gap:10px}
.griglia{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:10px}.corpo>*,.griglia>*{min-width:0}.box{overflow-x:auto}
.box{border:1px solid var(--bordo);border-radius:12px;padding:10px 12px;background:#fbfcfe}.box h4{margin:0 0 6px;font-size:14px;color:var(--notte)}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;margin:0}.dl dt{color:var(--grigio)}.dl dd{margin:0;font-weight:600}
table.rx{border-collapse:collapse;font-size:15px}table.rx th,table.rx td{border:1px solid var(--bordo);padding:5px 10px;text-align:center}table.rx th{background:#f1f4f9}
.dove{border-radius:12px;padding:9px 12px;font-weight:600}.dove.lab{background:#e8f5e9;color:#1e5e24}.dove.ott{background:#fdecea;color:#b3261e}
.az{display:flex;gap:6px;flex-wrap:wrap}
.msg{border-radius:12px;padding:10px 12px;margin:8px 0}.msg.ok{background:#e8f5e9;color:#1e5e24}.msg.err{background:#fdecea;color:#b3261e}
.vuoto{color:var(--grigio);text-align:center;padding:28px}
.sel{width:auto;margin:0;box-shadow:none}
.giro{background:#fff;border:1px solid var(--bordo);border-radius:16px;padding:12px 14px;margin:8px 0;box-shadow:var(--ombra)}.giro h4{margin:0 0 4px;color:var(--notte)}.giro ul{margin:6px 0 0;padding-left:18px}
@media (max-width:600px){.barra{grid-template-columns:1fr}table.rx th,table.rx td{padding:4px 6px;font-size:14px}main{padding:10px 10px 30px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div><b>SocialGlass</b> <span>Laboratorio</span></div><div id="chi"></div></header>
<main id="app"></main>
<script src="lab.js?v=1795900000"></script>
</body>
</html>
